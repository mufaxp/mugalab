<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Masuk - Laboratorium IPA</title>
    <link rel="stylesheet" href="/login/style.css?v=1.1">
</head>
<body>
    <div class="login-card">
        <h2 class="login-title">Selamat Datang</h2>
        <form id="loginForm" action="#" method="POST">
            <div class="input-group">
                <label for="username" style="display:none;">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="login-input" 
                    placeholder="Username" 
                    required 
                    autocomplete="username"
                >
            </div>
            <div class="input-group">
                <label for="password" style="display:none;">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="login-input" 
                    placeholder="Password" 
                    required 
                    autocomplete="current-password"
                >
            </div>
            <button type="submit" class="login-button">Masuk</button>
        </form>
        <div style="text-align:center; margin-top:16px;">
            <button type="button" id="btnLoginWajah" style="background:none; border:none; color:#0e703f; cursor:pointer; font-weight:600;">Login dengan Wajah 📷</button>
        </div>
    </div>

    <div id="modalLoginWajah" class="modal-overlay" style="display:none;">
        <div class="modal-content" style="max-width:400px; text-align:center;">
            <h3 class="modal-title">Login Wajah</h3>
            <p style="margin-bottom:12px; font-size:13px; color:#666;">Masukkan username Anda, lalu posisikan wajah di depan kamera.</p>
            
            <div class="input-group" style="margin-bottom:12px;">
                <input type="text" id="login_face_username" class="login-input" placeholder="Username Anda" required>
            </div>

            <div style="position:relative; width:100%; height:250px; background:#000; border-radius:10px; overflow:hidden; margin-bottom:12px;">
                <video id="videoLoginWajah" autoplay muted style="width:100%; height:100%; object-fit:cover;"></video>
            </div>
            
            <p id="statusLoginWajah" style="font-size:13px; font-weight:600; color:#0e703f; margin-bottom:12px;">Memuat AI...</p>
            
            <div class="modal-actions" style="justify-content:center;">
                <button type="button" class="login-button" id="btnVerifikasiWajah" disabled>Verifikasi & Masuk</button>
                <button type="button" class="login-button" style="background:#ccc; color:#333; margin-top:8px;" onclick="document.getElementById('modalLoginWajah').style.display='none'">Batal</button>
            </div>
        </div>
    </div>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="/login/script.js?v=2.4"></script>
</body>
</html>
