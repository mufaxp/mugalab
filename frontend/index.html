<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jadwal Laboratorium IPA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card">
        <div class="card-header">
            <span class="card-title">
                <span id="nama_lab_display">Laboratorium IPA</span><br>
                <span id="nama_sekolah_display">SMA Muhammadiyah 3 Jakarta</span>
            </span>
            <div class="week-selector">
                <select id="weekSelect" class="week-dropdown">
                    <option value="prev">Pekan Lalu</option>
                    <option value="current" selected>Pekan Ini</option>
                    <option value="next">Pekan Depan</option>
                </select>
            </div>
        </div>
        <!-- navigasi lab -->
        <div class="lab-navigation">
            <button class="lab-arrow" id="labPrev">◀</button>
            <span class="lab-title" id="labTitle">Lab Biologi dan Kimia</span>
            <button class="lab-arrow" id="labNext">▶</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Jam</th>
                        <th>Ahad</th>
                        <th>Senin</th>
                        <th>Selasa</th>
                        <th>Rabu</th>
                        <th>Kamis</th>
                        <th>Jumat</th>
                        <th>Sabtu</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>1</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td>2</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td>3</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td>4</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td>5</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td>6</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td>7</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td>8</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td>9</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td>10</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <!-- Modal Pengajuan dari Tabel -->
    <div id="modalPengajuan" class="modal-overlay" style="display:none;">
        <div class="modal-content" style="max-width:520px;">
            <h3 class="modal-title">Ajukan Peminjaman Ruangan</h3>
            <form id="formPengajuan">
                <!-- Info Otomatis -->
                <div class="info-box">
                    <p><strong>📅 Hari/Tanggal:</strong> <span id="pengajuan_hari_tanggal">-</span></p>
                    <p style="margin-top:4px;"><strong>🏠 Ruang:</strong> <span id="pengajuan_lab">-</span></p>
                </div>

                <div class="form-row">
                    <div class="form-group form-group-half">
                        <label for="pengajuan_jam_mulai">Jam Mulai</label>
                        <select id="pengajuan_jam_mulai" class="form-input" required>
                            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                            <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                            <option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
                        </select>
                    </div>
                    <div class="form-group form-group-half">
                        <label for="pengajuan_jam_selesai">Jam Selesai</label>
                        <select id="pengajuan_jam_selesai" class="form-input" required></select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="pengajuan_nama">Nama Lengkap</label>
                    <input type="text" id="pengajuan_nama" class="form-input" placeholder="Nama Anda" required>
                </div>
                <div class="form-group">
                    <label for="pengajuan_wa">Nomor WhatsApp</label>
                    <input type="text" id="pengajuan_wa" class="form-input" placeholder="628xxxxxxxxxx" required>
                </div>
                <div class="form-group">
                    <label for="pengajuan_mapel">Mata Pelajaran</label>
                    <input type="text" id="pengajuan_mapel" class="form-input" placeholder="Mata pelajaran">
                </div>
                <div class="form-group">
                    <label for="pengajuan_kegiatan">Kegiatan</label>
                    <input type="text" id="pengajuan_kegiatan" class="form-input" placeholder="Nama kegiatan" required>
                </div>
                <div class="form-group">
                    <label for="pengajuan_kelas">Kelas</label>
                    <input type="text" id="pengajuan_kelas" class="form-input" placeholder="Kelas (isi - untuk umum)">
                </div>

                <p class="modal-warning">⚠️ Pengajuan akan ditinjau oleh admin. Notifikasi akan dikirim via WhatsApp.</p>

                <div class="modal-actions">
                    <button type="submit" class="btn-simpan">Kirim Pengajuan</button>
                    <button type="button" class="btn-batal" onclick="document.getElementById('modalPengajuan').style.display='none'">Batal</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/main.js?v=5"></script>
</body>
</html>
